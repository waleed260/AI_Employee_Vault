[project]
name = "ai-employee-vault"
version = "0.1.0"
description = "Personal AI Employee - Autonomous FTE using Claude Code and Obsidian"
readme = "README.md"
authors = [
    { name = "waleed260", email = "vkdeku20@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.100.0",
    "google-auth>=2.23.0",
    "google-auth-oauthlib>=1.1.0",
    "playwright>=1.58.0",
    "watchdog>=3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
ai-employee = "src.orchestrator:main"
ai-gmail-watcher = "src.watchers.gmail_watcher:main"
ai-file-watcher = "src.watchers.filesystem_watcher:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
